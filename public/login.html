<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 股票视频整理台</title>
    <style>
      :root {
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #17212b;
        background: #0f2f4a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(9, 25, 39, 0.72), rgba(9, 25, 39, 0.18)),
          url("/login-bg.svg") center / cover no-repeat;
      }

      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 48px;
        align-items: center;
        width: min(1060px, calc(100% - 32px));
      }

      .copy {
        color: #fff;
      }

      .copy span {
        display: inline-flex;
        margin-bottom: 14px;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 999px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 13px;
      }

      h1 {
        margin: 0;
        font-size: 44px;
        line-height: 1.16;
      }

      .copy p {
        max-width: 560px;
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.78);
        font-size: 16px;
        line-height: 1.8;
      }

      form {
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        padding: 30px;
        backdrop-filter: blur(16px);
      }

      form h2 {
        margin: 0 0 6px;
        font-size: 24px;
      }

      form p {
        margin: 0 0 22px;
        color: #647280;
      }

      label {
        display: grid;
        gap: 8px;
        color: #647280;
        font-size: 13px;
        font-weight: 700;
      }

      input {
        min-height: 44px;
        border: 1px solid #d9e0e7;
        border-radius: 6px;
        padding: 9px 11px;
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 44px;
        margin-top: 18px;
        border: 1px solid #0b6bcb;
        border-radius: 6px;
        background: #0b6bcb;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #c83737;
        font-size: 13px;
      }

      @media (max-width: 840px) {
        .shell {
          grid-template-columns: 1fr;
          gap: 24px;
        }

        h1 {
          font-size: 34px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="copy">
        <span>Trading Intelligence</span>
        <h1>股票视频整理台</h1>
        <p>把每天收到的 PDF、图片和视频资料整理成股票池、买入区间、风险纪律和实时行情看板。</p>
      </section>
      <form id="loginForm">
        <h2>登录</h2>
        <p>请输入访问密码</p>
        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" autofocus required />
        </label>
        <button type="submit">进入系统</button>
        <div id="error" class="error"></div>
      </form>
    </main>
    <script>
      document.querySelector("#loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.querySelector("#error");
        error.textContent = "";
        const password = new FormData(event.currentTarget).get("password");
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (response.ok) {
          window.location.href = "/";
          return;
        }
        const payload = await response.json().catch(() => ({}));
        error.textContent = payload.error || "登录失败";
      });
    </script>
  </body>
</html>
