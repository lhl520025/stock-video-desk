<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 - 股票视频整理台</title>
    <style>
      :root {
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #14202b;
        background: #101923;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          linear-gradient(90deg, rgba(11, 20, 31, 0.9), rgba(11, 20, 31, 0.48) 52%, rgba(11, 20, 31, 0.18)),
          url("/login-bg.svg") center / cover no-repeat;
      }

      .shell {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(0, 1fr) 430px;
        gap: 52px;
        align-items: center;
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 38px 0;
      }

      .copy {
        color: #fff;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
      }

      .brand-mark {
        display: inline-grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 8px;
        background: #fff;
        color: #101923;
        font-weight: 900;
      }

      .copy span.kicker {
        display: inline-flex;
        margin-bottom: 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        padding: 6px 12px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: 46px;
        line-height: 1.14;
      }

      .copy p {
        max-width: 610px;
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.76);
        font-size: 16px;
        line-height: 1.85;
      }

      .signals {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        max-width: 620px;
        margin-top: 30px;
      }

      .signals div {
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        padding: 12px;
      }

      .signals strong {
        display: block;
        margin-bottom: 5px;
      }

      .signals small {
        color: rgba(255, 255, 255, 0.58);
      }

      form {
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
        padding: 30px;
        backdrop-filter: blur(18px);
      }

      form h2 {
        margin: 0 0 6px;
        font-size: 24px;
      }

      form p {
        margin: 0 0 24px;
        color: #657281;
        line-height: 1.6;
      }

      label {
        display: grid;
        gap: 8px;
        color: #657281;
        font-size: 13px;
        font-weight: 800;
      }

      input {
        min-height: 46px;
        border: 1px solid #dce3ea;
        border-radius: 7px;
        padding: 9px 11px;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: #1769aa;
        box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12);
      }

      button {
        width: 100%;
        min-height: 46px;
        margin-top: 18px;
        border: 1px solid #1769aa;
        border-radius: 7px;
        background: #1769aa;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: #0c4e86;
      }

      .error {
        min-height: 20px;
        margin-top: 12px;
        color: #c43d3d;
        font-size: 13px;
      }

      @media (max-width: 880px) {
        .shell {
          grid-template-columns: 1fr;
          gap: 26px;
        }

        h1 {
          font-size: 34px;
        }

        .signals {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="copy">
        <div class="brand">
          <span class="brand-mark">股</span>
          <strong>Stock Video Desk</strong>
        </div>
        <span class="kicker">Trading Intelligence</span>
        <h1>把每天收到的资料，整理成能执行的股票池。</h1>
        <p>上传 PDF、截图和视频，沉淀市场观点、入池逻辑、买入区间、止损目标，并在同一个看板里跟踪实时涨跌。</p>
        <div class="signals">
          <div>
            <strong>资料导入</strong>
            <small>PDF / 图片 / 视频</small>
          </div>
          <div>
            <strong>AI 分析</strong>
            <small>本机分析后同步</small>
          </div>
          <div>
            <strong>行情看板</strong>
            <small>东方财富公开行情</small>
          </div>
        </div>
      </section>

      <form id="loginForm">
        <h2>登录工作台</h2>
        <p>请输入访问密码进入股票视频整理系统。</p>
        <label>
          访问密码
          <input name="password" type="password" autocomplete="current-password" autofocus required />
        </label>
        <button type="submit">进入系统</button>
        <div id="error" class="error"></div>
      </form>
    </main>
    <script>
      document.querySelector("#loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.querySelector("#error");
        error.textContent = "";
        const password = new FormData(event.currentTarget).get("password");
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if (response.ok) {
          window.location.href = "/";
          return;
        }
        const payload = await response.json().catch(() => ({}));
        error.textContent = payload.error || "登录失败";
      });
    </script>
  </body>
</html>
